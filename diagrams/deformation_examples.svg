<svg width="900" height="350" viewBox="0 0 900 350" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Panel backgrounds (transparent) -->
    <!-- Panel titles -->
    <text x="150" y="35" font-family="Arial" font-size="18" text-anchor="middle" fill="#000">Aligned
        State</text>
    <text x="450" y="35" font-family="Arial" font-size="18" text-anchor="middle" fill="#000">Axis
        Elongation</text>
    <text x="750" y="35" font-family="Arial" font-size="18" text-anchor="middle" fill="#000">Detected
        Asymmetry</text>
    <!-- Aligned State Octahedron -->
    <g stroke="#000" stroke-width="3" fill="none">
        <line x1="150" y1="80" x2="250" y2="175" />
        <line x1="150" y1="80" x2="50" y2="175" />
        <line x1="150" y1="80" x2="150" y2="270" />
        <line x1="250" y1="175" x2="150" y2="270" />
        <line x1="250" y1="175" x2="150" y2="175" />
        <line x1="50" y1="175" x2="150" y2="270" />
        <line x1="50" y1="175" x2="150" y2="175" />
        <line x1="150" y1="175" x2="150" y2="80" />
        <line x1="150" y1="175" x2="250" y2="175" />
        <line x1="150" y1="175" x2="50" y2="175" />
        <line x1="150" y1="175" x2="150" y2="270" />
        <circle cx="150" cy="80" r="6" fill="#000" />
        <circle cx="250" cy="175" r="6" fill="#000" />
        <circle cx="50" cy="175" r="6" fill="#000" />
        <circle cx="150" cy="270" r="6" fill="#000" />
        <circle cx="150" cy="175" r="6" fill="#000" />
    </g>
    <!-- Axis Elongation Octahedron (V6 elongated downward) -->
    <g stroke="#000" stroke-width="3" fill="none">
        <line x1="450" y1="80" x2="550" y2="175" />
        <line x1="450" y1="80" x2="350" y2="175" />
        <line x1="450" y1="80" x2="450" y2="320" />
        <line x1="550" y1="175" x2="450" y2="320" />
        <line x1="550" y1="175" x2="450" y2="175" />
        <line x1="350" y1="175" x2="450" y2="320" />
        <line x1="350" y1="175" x2="450" y2="175" />
        <line x1="450" y1="175" x2="450" y2="80" />
        <line x1="450" y1="175" x2="550" y2="175" />
        <line x1="450" y1="175" x2="350" y2="175" />
        <line x1="450" y1="175" x2="450" y2="320" />
        <circle cx="450" cy="80" r="6" fill="#000" />
        <circle cx="550" cy="175" r="6" fill="#000" />
        <circle cx="350" cy="175" r="6" fill="#000" />
        <circle cx="450" cy="320" r="6" fill="#000" />
        <circle cx="450" cy="175" r="6" fill="#000" />
    </g>
    <!-- Detected Asymmetry Octahedron (severe, with red highlight) -->
    <g stroke="#000" stroke-width="3" fill="none">
        <line x1="750" y1="80" x2="850" y2="175" />
        <line x1="750" y1="80" x2="650" y2="175" />
        <line x1="750" y1="80" x2="750" y2="340" />
        <line x1="850" y1="175" x2="750" y2="340" />
        <line x1="850" y1="175" x2="750" y2="175" />
        <line x1="650" y1="175" x2="750" y2="340" />
        <line x1="650" y1="175" x2="750" y2="175" />
        <line x1="750" y1="175" x2="750" y2="80" />
        <line x1="750" y1="175" x2="850" y2="175" />
        <line x1="750" y1="175" x2="650" y2="175" />
        <line x1="750" y1="175" x2="750" y2="340" />
        <circle cx="750" cy="80" r="6" fill="#000" />
        <circle cx="850" cy="175" r="6" fill="#000" />
        <circle cx="650" cy="175" r="6" fill="#000" />
        <circle cx="750" cy="340" r="6" fill="#000" stroke="#e41a1c" stroke-width="4" />
        <circle cx="750" cy="175" r="6" fill="#000" />
        <!-- Highlight deformation -->
        <ellipse cx="750" cy="340" rx="18" ry="10" fill="none" stroke="#e41a1c" stroke-width="4" />
        <line x1="750" y1="300" x2="750" y2="340" stroke="#e41a1c" stroke-width="4"
            marker-end="url(#arrow)" />
    </g>
    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"
            markerUnits="strokeWidth">
            <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#e41a1c" />
        </marker>
    </defs>
</svg>
