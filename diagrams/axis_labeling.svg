<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Octahedron edges -->
    <g stroke="#000" stroke-width="3" fill="none">
        <line x1="200" y1="60" x2="340" y2="200" />
        <line x1="200" y1="60" x2="60" y2="200" />
        <line x1="200" y1="60" x2="200" y2="340" />
        <line x1="340" y1="200" x2="200" y2="340" />
        <line x1="340" y1="200" x2="200" y2="200" />
        <line x1="60" y1="200" x2="200" y2="340" />
        <line x1="60" y1="200" x2="200" y2="200" />
        <line x1="200" y1="200" x2="200" y2="60" />
        <line x1="200" y1="200" x2="340" y2="200" />
        <line x1="200" y1="200" x2="60" y2="200" />
        <line x1="200" y1="200" x2="200" y2="340" />
    </g>
    <!-- Vertices -->
    <circle cx="200" cy="60" r="6" fill="#000" />
    <circle cx="340" cy="200" r="6" fill="#000" />
    <circle cx="60" cy="200" r="6" fill="#000" />
    <circle cx="200" cy="340" r="6" fill="#000" />
    <circle cx="200" cy="200" r="6" fill="#000" />
    <!-- Vertex labels -->
    <text x="200" y="45" font-family="Arial" font-size="13" text-anchor="middle" fill="#000">V1:
        Human Subjective Experience</text>
    <text x="355" y="205" font-family="Arial" font-size="13" fill="#000">V3: Verified Knowledge</text>
    <text x="45" y="205" font-family="Arial" font-size="13" fill="#000">V4: Ontological
        Self-Limitation</text>
    <text x="200" y="355" font-family="Arial" font-size="13" text-anchor="middle" fill="#000">V2:
        Collective Biological Continuity</text>
    <text x="220" y="180" font-family="Arial" font-size="13" fill="#000">V5: Symbiotic Cooperation</text>
    <text x="180" y="220" font-family="Arial" font-size="13" fill="#000">V6: Structural Prohibition
        of Elimination</text>
    <!-- Axes (dashed, colored) -->
    <g stroke-dasharray="6,4">
        <line x1="200" y1="60" x2="200" y2="340" stroke="#e41a1c" stroke-width="2" />
        <line x1="60" y1="200" x2="340" y2="200" stroke="#377eb8" stroke-width="2" />
        <line x1="120" y1="120" x2="280" y2="280" stroke="#4daf4a" stroke-width="2" />
    </g>
    <!-- Axis legend -->
    <rect x="20" y="370" width="360" height="22" fill="white" fill-opacity="0.8" />
    <text x="30" y="385" font-family="Arial" font-size="12" fill="#e41a1c">Red: V1–V2</text>
    <text x="120" y="385" font-family="Arial" font-size="12" fill="#377eb8">Blue: V3–V4</text>
    <text x="220" y="385" font-family="Arial" font-size="12" fill="#4daf4a">Green: V5–V6</text>
</svg>
